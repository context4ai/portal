entries:
  - version: 0.13.3
    date: 2026-10-16T00:23:24.109Z
    title: Introduction video and a quieter documentation home
    changes:
      - The documentation home uses one blue for links and highlights, and
        lighter borders across the site.
      - Site Map and Tools and Resources share the heading, card and spacing of
        the sections above; section names on site-map cards are no longer shrunk
        to small gray text.
      - Benchmark and compression figures use the body font in ink; blue marks
        only links, knowledge figures and the live path.
      - Homepage diagrams use one dash pattern, lighter lines and labels of at
        least 12px; the footer keeps a single rule.
      - The homepage slogan and docs home open the three-minute introduction at
        /intro/, with native fullscreen playback on phones and tablets.
      - Local preview serves the homepage and documentation together; outlined
        entry buttons use a solid page-colored background.
      - Build tooling uses Context SDK and CLI 0.7.72.
    triggers:
      - kind: other
        description: Review of the documentation home found sections with different
          heading, card and color styles; the quieter variant was chosen without
          changing the layout.
      - kind: other
        description: Requested the introduction video, local preview and solid button
          backgrounds.
    actor:
      name: qiansc
      kind: git
  - version: 0.13.2
    date: 2026-10-15T06:58:22.895Z
    title: Citations re-confirmed against Context 0.7.71 sources
    changes:
      - Citations on 42 pages point to the current source positions; 17 cited
        passages had changed (version numbers, links, the Bun requirement,
        marketplace install text) and were re-read.
      - Project API documents the nav link position option; Page and Theme
        Customization notes that sites open in light mode and remember the
        reader's choice per origin.
      - Chinese translations follow both changes.
    triggers:
      - kind: repair
        description: Source regions cited by pages written before region baselines
          existed no longer matched the 0.7.71 sources.
    actor:
      name: qiansc
      kind: git
  - version: 0.13.1
    date: 2026-10-15T06:25:57.941Z
    title: Plugin marketplace install and Context 0.7.63–0.7.71 updates
    changes:
      - Installation adds installing the c4a plugin in Claude Code or Codex by
        adding the context4ai/context repository as a plugin marketplace; the
        CLI is still installed from npm.
      - The knowledge-workspace page links to Referencing Same-Repository Docs
        and Skills by its current title.
      - Release Notes add Context 0.7.63–0.7.67 (light-mode default, builds
        without source checkouts, inline code links, section landing cards,
        start nav links) and 0.7.70–0.7.71 (marketplace install, heading and
        quote locators, up to eight regions per fragment, kept citations on
        revision, relocated citations after updates, incremental translation
        drafts).
      - Documentation Sites, Page and Theme Customization, Multilingual Sites,
        Revising a Page, Updating Knowledge, Evidence Chains, CLI Commands,
        Package Templates and the Code and Document Indexer guides follow these
        changes.
      - Chinese translations follow every change.
    triggers:
      - kind: module
        description: Context and Agent Graph sources updated to the Context 0.7.71 release.
      - kind: other
        description: Requested documentation of the plugin marketplace installation and
          a corrected link title.
    actor:
      name: qiansc
      kind: git
  - version: 0.13.0
    date: 2026-10-15T03:58:42.198Z
    title: Clearer getting-started path, cost guidance and same-repository content
    changes:
      - What is Context states its main strength (building systematic knowledge
        step by step from existing docs and code), defines LLM Wiki, says what a
        round produces and sets the reading order.
      - The Workflow at a Glance now has five steps after a one-time
        installation, marks the two decisions that are yours, and adds token
        cost from experience for a first build, updates and answers.
      - Quick Start drops commands the Agent runs for you, adds resuming after
        an interruption and a first question; Core Concepts explains the
        work-start report and managed mode and separates
        knowledge/structure.yaml from the navigation map.
      - Commands and Skills puts common requests first and summarizes automatic
        Skills; Installation adds Bun and notes it happens once per machine.
      - "Same-Repository Docs is now Referencing Same-Repository Docs and
        Skills: register docs and Skills maintained beside the code so Context
        references them instead of producing them again; related pages and the
        FAQ link to it."
      - Chinese translations follow every change.
    triggers:
      - kind: note
        description: "New getting-started guidance note: main strengths, reading order
          and token cost."
      - kind: other
        description: Port reader-facing refinements from another Context knowledge
          base's getting-started pages, excluding organization-specific
          infrastructure.
      - kind: translation
        description: Update zh-CN translations of the revised pages.
    actor:
      name: qiansc
      kind: git
  - version: 0.12.1
    date: 2026-10-14T13:15:06.193Z
    title: Natural Chinese example prompts and language-stable anchors
    changes:
      - Translate plain-text example prompts and explanatory comments into
        natural Chinese while preserving commands, paths and placeholders.
      - Links to a section keep the Chinese reader on the Chinese page and
        scroll to the matching heading, including repeated clicks and
        back/forward.
    triggers:
      - kind: translation
        description: Refresh Chinese text blocks without changing approved source articles.
      - kind: module
        description: Context CLI 0.7.70 permits translated prose in text, txt and
          plaintext fences, keeps anchors in the reader's language and records
          translation baselines for incremental updates.
    actor:
      name: qiansc
      kind: git
  - version: 0.12.0
    date: 2026-10-14T10:26:05.289Z
    title: Cold-starting a knowledge base
    changes:
      - "New guide Cold-Starting a Knowledge Base: explore code before
        registering, screen each source group by relevance, reader fit,
        authority, recency, verifiability and conflict, name a baseline, settle
        a three-level structure before writing, and keep raw material apart from
        sources, with two example opening conversations."
      - "Knowledge for Agents explains how deep code knowledge goes: locating
        and contract layers up front, implementation read on demand at a pinned
        commit."
      - External Entrances separates registered sources, entrances and a raw
        folder; Best Practices and Prompt Recipes link the new guide.
    triggers:
      - kind: note
        description: A desensitized note on cold-start practice and two example
          conversations.
      - kind: navigation
        description: Cold-Starting a Knowledge Base placed second under Practices.
      - kind: translation
        description: Chinese translations for the new and revised pages.
    actor:
      name: qiansc
      kind: git
  - version: 0.11.3
    date: 2026-10-14T08:53:49.632Z
    title: Source Graph code source settings
    changes:
      - Registering Repositories and Configuration now describe the Code sources
        settings page, with one card per source holding its token and, for the
        custom Git source, its name, host and HTTPS username, and the personal
        Code source tokens.
      - The GitHub environment token is SOURCEGRAPH_GITHUB_TOKEN, with
        SOURCEGRAPH_GIT_TOKEN still read while it is unset.
      - Source Graph pages cite its new code sources and tokens reference; their
        other guidance is unchanged.
    triggers:
      - kind: module
        description: Source Graph reorganized its code source settings, renamed the
          GitHub environment token and added a code sources reference.
      - kind: translation
        description: Chinese translations for the revised pages.
    actor:
      name: qiansc
      kind: git
  - version: 0.11.2
    date: 2026-10-14T04:39:35.230Z
    title: Context 0.7.67
    changes:
      - The site opens in light mode regardless of the system color scheme; the
        reader's light/dark and language choices are shared across sites on this
        origin.
      - Pages are built without reading the source repositories; CI fails when
        context verify reports a changed or moved cited source region.
    triggers:
