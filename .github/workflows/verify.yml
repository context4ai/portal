name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run sources:restore
      - run: bunx context status
      - run: bunx context verify
      - name: No changed source regions
        run: bunx context verify --format json | jq -e '[.issues[] | select(.code | startswith("approved-source-region"))] | length == 0'
      - run: bun run build
      - run: bun run check:links

      - name: Nginx configuration
        run: |
          docker run --rm \
            -e SOURCEGRAPH_UPSTREAM=http://127.0.0.1:9 -e NGINX_RESOLVER=127.0.0.11 \
            -v "$PWD/deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.29-alpine nginx -t

      - name: Image build and smoke test
        run: |
          docker build -t portal:ci .
          docker run -d --name portal -p 8080:8080 portal:ci
          trap 'docker rm -f portal >/dev/null' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/zh/
          curl -fsS -o /dev/null http://127.0.0.1:8080/context/
          curl -fsS -o /dev/null http://127.0.0.1:8080/context/llms.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/llms.txt)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/context)" = 301
